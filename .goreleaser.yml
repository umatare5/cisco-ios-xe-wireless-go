# .goreleaser.yml for cisco-ios-xe-wireless-go SDK package

project_name: cisco-ios-xe-wireless-go
version: 2

# Distribution directory
dist: tmp/dist

# Build destination
github_urls:
  # set to true if you use a self-signed certificate
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

# No binary builds for a library package
builds:
  - skip: true

# Release configuration
release:
  prerelease: auto
  # Drafted, not published: goreleaser composes the body from header, generated
  # changelog and footer, so a hand-written migration note has to be pasted in
  # before the release becomes visible.
  draft: true
  replace_existing_draft: true
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    This release contains the Go SDK for interacting with Cisco Catalyst 9800 Wireless Network Controller.

    > [!IMPORTANT]
    > This SDK is pre-1.0 and a MINOR release may change or remove exported API. Read the notes below before upgrading.

    ### 📦 Installation

    ```bash
    go get github.com/umatare5/cisco-ios-xe-wireless-go@v{{ .Version }}
    ```

  footer: |
    **Full Changelog**: https://github.com/umatare5/cisco-ios-xe-wireless-go/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### Documentation
    - [README](https://github.com/umatare5/cisco-ios-xe-wireless-go/blob/{{ .Tag }}/README.md)
    - [API Reference](https://pkg.go.dev/github.com/umatare5/cisco-ios-xe-wireless-go@v{{ .Version }})

# Checksums for published artifacts
checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Breaking Changes
      regexp: '^.*?[[:word:]]+(\([[:word:]]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^Merge branch '
      - '^release:'
      - '^ci:'
      - '^test:'

# Metadata for Go proxy and pkg.go.dev
metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'
