---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint-full

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # The upstream hook definition omits this, and gitleaks takes a lone
        # positional argument as the repository path
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-commit-to-main
        name: no-commit-to-main
        entry: .githooks/no-commit-to-main
        language: script
        pass_filenames: false
        always_run: true

  # Pinned rather than taken from PATH: the MD043 and MD033 overrides this
  # repository relies on are inert before v0.23, and CI runs 0.23.2 as well
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
