name: CodeQL Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Sundays at 12:00 UTC
    - cron: "0 12 * * 0"

permissions:
  security-events: write
  packages: read

jobs:
  codeql:
    uses: umatare5/common/.github/workflows/codeql.yml@c398db4525f79997fd25bfb7b1f1292d236f7fce # v0.16.0
